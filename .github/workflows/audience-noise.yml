name: Audience noise generator

# Fires client-side flag evaluations against every LD demo project so the
# Audience tab has realistic 24/7 traffic. Burst size varies by UTC hour to
# produce a natural peak-and-trough curve; see the case statement in the
# `plan` step. Discovery is dynamic (scripts/discover-envs.mjs), so new or
# recreated projects are picked up automatically on the next cycle.

on:
  schedule:
    # GH Actions cron can't express "every 90 min" (minutes are 0-59), so
    # we alternate two schedules to fire every ~90 min = 16 runs/day.
    - cron: '0 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
    inputs:
      burst_size_override:
        description: 'Force this many contexts per project (bypasses hourly curve)'
        required: false
        type: string
      include_pattern:
        description: 'Only run for projects matching this regex'
        required: false
        type: string

concurrency:
  # Prevent overlapping runs from doubling load on any single env.
  group: audience-noise
  cancel-in-progress: false

# Least-privilege token: this workflow only needs to read the checked-out repo.
permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      burst_size: ${{ steps.plan.outputs.burst_size }}
      curve_label: ${{ steps.plan.outputs.curve_label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Discover projects
        id: discover
        env:
          LD_API_KEY: ${{ secrets.LD_API_KEY }}
          LD_INCLUDE_PATTERN: ${{ inputs.include_pattern }}
        run: |
          node scripts/discover-envs.mjs > envs.json
          echo "--- Discovered envs ---"
          cat envs.json

      - name: Build matrix
        id: build
        run: |
          # {include: [...]} is the shape GH Actions expects for a dynamic matrix.
          MATRIX=$(jq -c '{include: .}' envs.json)
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Plan burst size for this run
        id: plan
        run: |
          # Burst size varies by UTC hour to model a US-East consumer app:
          # evening-ET peak (00-02 UTC), overnight trough (04-11 UTC),
          # midday-ET peak (14-16 UTC), prime-time bump (21-23 UTC).
          HOUR=$(date -u +%H | sed 's/^0//')
          HOUR=${HOUR:-0}

          case $HOUR in
            0|1|2)       SIZE=2400 ; LABEL="evening peak" ;;
            3)           SIZE=1800 ; LABEL="late evening" ;;
            4|5)         SIZE=800  ; LABEL="deep overnight" ;;
            6|7|8)       SIZE=600  ; LABEL="overnight trough" ;;
            9|10)        SIZE=900  ; LABEL="early morning" ;;
            11)          SIZE=1300 ; LABEL="morning ramp" ;;
            12|13)       SIZE=1700 ; LABEL="late morning" ;;
            14|15|16)    SIZE=2100 ; LABEL="midday peak" ;;
            17|18)       SIZE=1800 ; LABEL="afternoon" ;;
            19|20)       SIZE=1500 ; LABEL="early evening" ;;
            21|22|23)    SIZE=1900 ; LABEL="prime time" ;;
            *)           SIZE=1200 ; LABEL="default" ;;
          esac

          if [ -n "${{ inputs.burst_size_override }}" ]; then
            SIZE=${{ inputs.burst_size_override }}
            LABEL="override"
          fi

          # ±20% jitter so same-hour runs on different days aren't identical.
          JITTER=$(( RANDOM % 41 - 20 ))
          SIZE=$(( SIZE + (SIZE * JITTER / 100) ))

          echo "burst_size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "curve_label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "🎯 UTC hour $HOUR ($LABEL) → burst size $SIZE (with ${JITTER}% jitter)"

  burst:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' && needs.discover.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Cap prevents exceeding GH Actions concurrent-job limits.
      max-parallel: 10
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install noise generator dependency
        # Install only what the script needs; skipping the full install
        # saves ~90 sec per matrix job.
        run: npm install --no-save --no-audit --no-fund --legacy-peer-deps @launchdarkly/node-client-sdk

      - name: Run burst against ${{ matrix.project }}
        env:
          NEXT_PUBLIC_LD_CLIENT_KEY: ${{ matrix.clientId }}
          NUM_CONTEXTS: ${{ needs.discover.outputs.burst_size }}
          REPEAT_RATE: '0.3'
          # Spread the burst across time so the graph shows a curve, not a spike.
          DURATION_MINUTES: '15'
          FLUSH_EVERY: '25'
          LOG_EVERY: '500'
          EVENTS_CAPACITY: '20000'
        run: |
          echo "=========================================="
          echo "  Project:     ${{ matrix.project }}"
          echo "  Env:         ${{ matrix.env }}"
          echo "  Client ID:   ${{ matrix.clientId }}"
          echo "  Burst size:  ${{ needs.discover.outputs.burst_size }} (${{ needs.discover.outputs.curve_label }})"
          echo "=========================================="
          node scripts/generate-audience-noise.mjs

  summarize:
    needs: [discover, burst]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        run: |
          {
            echo "## Audience noise run"
            echo ""
            echo "- **UTC hour**: $(date -u +%H)"
            echo "- **Curve segment**: ${{ needs.discover.outputs.curve_label }}"
            echo "- **Burst size**: ${{ needs.discover.outputs.burst_size }} contexts / project"
            echo "- **Result**: ${{ needs.burst.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
